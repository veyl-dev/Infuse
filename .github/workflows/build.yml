name: Build
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: infusesmp-s3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc1.21
            java: '21'
            paper-api: '1.21.1-R0.1-SNAPSHOT'
            api-version: '1.21'
          - target: mc26.3
            java: '25'
            paper-api: '26.3.build.+'
            api-version: '26.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build ${{ matrix.target }}
        run: gradle clean build --no-daemon -PtargetJava=${{ matrix.java }} -PpaperApiVersion=${{ matrix.paper-api }} -PtargetApi=${{ matrix.api-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: InfuseSMP-S3-${{ matrix.target }}
          path: build/libs/*.jar
