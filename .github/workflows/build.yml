name: Build
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: infusesmp-s3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc1.21
            java: '21'
            paper-api: '1.21.1-R0.1-SNAPSHOT'
            api-version: '1.21'
          - target: mc26.3
            java: '25'
            paper-api: '26.3.build.+'
            api-version: '26.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate version-matched resource packs and runtime hashes
        run: python scripts/build-resource-packs.py
      - name: Build ${{ matrix.target }}
        run: gradle clean build --no-daemon -PtargetJava=${{ matrix.java }} -PpaperApiVersion=${{ matrix.paper-api }} -PtargetApi=${{ matrix.api-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: InfuseSMP-S3-${{ matrix.target }}
          path: build/libs/*.jar

  publish-resource-packs:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build version-matched S3 resource packs
        run: python scripts/build-resource-packs.py
      - name: Publish resource packs for automatic client download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s3-resourcepack
          name: InfuseSMP S3 Resource Pack
          files: dist/resourcepacks/*.zip
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
