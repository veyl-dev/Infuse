  - "<gray>/infuse get [player] <dark_gray>- <white>View equipped effects"
  - "<gray>/infuse add <player> <slot> <effect> [augmented]"
  - "<gray>/infuse remove <player> <slot>"
  - "<gray>/infuse give <player> <effect> [augmented]"
  - "<gray>/activate <primary|secondary> <dark_gray>- <white>Use a spark"
  - "<gray>/drain <primary|secondary> <dark_gray>- <white>Turn an equipped effect back into a potion"
  - "<gray>/swap <dark_gray>- <white>Swap your slots"
  - "<gray>/trust <add|remove|list|clear> [player]"
  - "<gray>/recipes <dark_gray>- <white>Open the recipe guide"
