prefix: "<gradient:#A2C81C:#21CD76>Infuse</gradient> <dark_gray>»</dark_gray> "
no-permission: "<red>You do not have permission to do that."
players-only: "<red>This command can only be used by a player."
player-not-found: "<red>That player is not online."
unknown-effect: "<red>Unknown effect. Use /infuse effects."
effect-added: "<green>Equipped <white>{effect}</white> in your <white>{slot}</white> slot."
effect-removed: "<yellow>Removed the {slot} effect."
effect-empty: "<gray>Your {slot} slot is empty."
cooldown: "<red>Your spark is recharging for <white>{time}</white>."
spark-used: "<green>You activated your {slot} spark."
trust-added: "<green>Added <white>{player}</white> to your trust list."
trust-removed: "<yellow>Removed <white>{player}</white> from your trust list."
trust-full: "<red>Your trust list is full."
reloaded: "<green>Configuration reloaded."
help:
  - "<gradient:#A2C81C:#21CD76><bold>InfuseSMP S3</bold></gradient>"
  - "<gray>/infuse gui <dark_gray>- <white>Open the effects and recipe guide"
  - "<gray>/infuse effects <dark_gray>- <white>List all effects"
  - "<gray>/infuse controls <dark_gray>- <white>View your spark keybinds"
