# InfuseSMP S3 configuration.
# Custom model data is intentionally fixed in the plugin and is not configurable here.

regions:
  disabled:
    # Add named disabled regions below when needed.
    # Example:
    # spawn:
    #   world: world
    #   min:
    #     x: -50
    #     y: 0
    #     z: -50
    #   max:
    #     x: 50
    #     y: 255
    #     z: 50

rituals:
  duration-seconds: 600
  ender-duration-seconds: 3600
  beacon: true
  protect-brewing-stand: true

settings:
  autosave-seconds: 60
  hit-counter-decay-seconds: 15
  allow-same-effects: false
  allow-true-damage: true
  roll-first-join: false
  roll-animation: true
  head-drop: false
  lock-effect-slots: false
  disabled-worlds:
    - disabled_world
  controls:
    enabled: true
    default-primary: swap
    default-secondary: drop
  drop-on-natural-death: true
  effect-drop-mode: random
  trust-list:
    maximum: 3
    action-delay-seconds: 10
  resource-pack:
    enabled: false
    url: ""
    sha1: ""
    prompt: "Install the InfuseSMP S3 resource pack for the complete experience."

items:
  potion-material: POTION

effects:
  primary:
    - heart
    - strength
    - regeneration
    - haste
    - invisibility
    - frost
    - thunder
    - feather
  secondary:
