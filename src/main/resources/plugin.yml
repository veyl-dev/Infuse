name: InfuseSMP-S3
version: ${version}
main: dev.veyl.infusesmp.InfuseSMP
api-version: '${apiVersion}'
description: Infuse SMP Season 3 abilities, effects and crafting.
author: veyl-dev
website: https://github.com/veyl-dev/Infuse
commands:
  infuse:
    description: Main InfuseSMP S3 command.
    usage: /infuse help
    aliases: [infusesmp]
  activate:
    description: Activate a primary or secondary Infuse spark.
    usage: /activate <primary|secondary>
    aliases: [a, use]
  trust:
    description: Manage your Infuse trust list.
    usage: /trust <add|remove|list|clear> [player]
  swap:
    description: Swap your primary and secondary Infuse effects.
    usage: /swap
  drain:
    description: Drain an equipped effect into a potion item.
    usage: /drain <primary|secondary>
  recipes:
    description: View Infuse effect recipes.
    usage: /recipes
permissions:
  infusesmp.use:
    default: true
  infusesmp.admin:
    default: op
    children:
      infusesmp.reload: true
      infusesmp.manage: true
      infusesmp.give: true
  infusesmp.reload:
    default: op
  infusesmp.manage:
    default: op
  infusesmp.give:
    default: op
